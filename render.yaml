services:
  - type: web
    name: rock-youth-point-tracker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
